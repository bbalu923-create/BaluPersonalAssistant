name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Build APK
        run: |
          unzip -o BaluPersonalAssistant_Free_APK_Build.zip
          cd BaluPersonalAssistant
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Balu-Assistant-APK
          path: BaluPersonalAssistant/app/build/outputs/apk/debug/app-debug.apk
